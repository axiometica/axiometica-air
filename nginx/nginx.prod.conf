# ─────────────────────────────────────────────────────────────────────────────
# Production nginx configuration
#
# TLS termination + reverse proxy. All static content is served by the
# agentic_os_frontend container (port 3000). API and WebSocket requests
# are proxied directly to agentic_os_backend:8000 to avoid double-hopping.
#
#   • HTTP 80  → 301 HTTPS redirect
#   • HTTPS 443 → TLS termination
#       /api*  → proxy to backend:8000
#       /ws*   → WebSocket proxy to backend:8000
#       /*     → proxy to frontend:3000
#
# Security headers and TLS settings match nginx/nginx.conf (the dev TLS proxy).
# ─────────────────────────────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
# default_server ensures this block handles all hostnames that don't match
# an explicit server_name in other conf.d files (e.g. analytics.conf for
# Umami). Without it, alphabetical include order could silently make
# another block the default.
server {
    listen 443 ssl default_server;
    server_name _;

    # TLS certificate (self-signed by default; replace with CA-signed in prod)
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options     "nosniff"                             always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
    # CSP allows analytics.axiometica.com in script-src / connect-src so
    # the platform can load the Umami tracker and POST events cross-origin
    # to the analytics subdomain. Harmless on installs that don't run
    # Umami — the script is still gated in analytics.ts by a hostname
    # allow-list, so it never fires anywhere unexpected.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://analytics.axiometica.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: ws: https://analytics.axiometica.com; font-src 'self' data:;"
        always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Optional location overrides (demo overlay injects routes here) ────────
    # Empty directory = no-op; demo overlay mounts location snippets into it.
    include /etc/nginx/locations.d/*.conf;

    # ── API proxy → backend (direct, no double-hop) ──────────────────────────
    location /api {
        proxy_pass         http://agentic_os_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
        proxy_connect_timeout 60s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # ── WebSocket proxy → backend ─────────────────────────────────────────────
    location /ws {
        proxy_pass         http://agentic_os_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # Long timeout keeps WebSocket connections alive
        proxy_read_timeout 86400s;
        proxy_buffering    off;
    }

    # ── Everything else → frontend container ─────────────────────────────────
    # The frontend container handles /assets caching, /editor/ routing,
    # and the SPA catch-all internally.
    location / {
        set $upstream_frontend "agentic_os_frontend:3000";
        proxy_pass         http://$upstream_frontend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
