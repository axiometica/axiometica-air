version: "3.8"

services:
  ssh_target:
    build:
      context: ./backend
      dockerfile: Dockerfile.ssh-target
    container_name: ssh_target
    restart: "no"
    hostname: ssh-target

  watcher_ssh_test:
    build:
      context: ./backend
      dockerfile: Dockerfile.watcher
    container_name: watcher_ssh_test
    restart: "no"
    depends_on:
      - ssh_target
    ports:
      - "8081:8080"
    volumes:
      - ./backend/watcher_main.py:/app/watcher_main.py
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHER_NAME: watcher_ssh_test
      WATCHER_API_URL: https://instance.axiometica.com
      WATCHER_API_KEY: ${WATCHER_API_KEY}
      WATCHER_NGINX_URL: https://instance.axiometica.com

      # Force SSH adapter — target is the ssh_target container on the same network
      # No local credentials: watcher resolves SSH key from platform credential store
      WATCHER_ADAPTER: ssh
      WATCHER_SSH_HOST: ssh_target
      WATCHER_SSH_PORT: "22"
      WATCHER_SSH_STRICT_HOST_KEYS: "false"

      # Polling & cooldown
      WATCHER_POLL_INTERVAL: "10"
      WATCHER_COOLDOWN_SECONDS: "60"

      # Anomaly thresholds
      WATCHER_ANOMALY_THRESHOLD: "1000"
      WATCHER_CPU_THRESHOLD: "80.0"
      WATCHER_MEMORY_THRESHOLD: "90.0"
      WATCHER_DISK_THRESHOLD: "90.0"
      WATCHER_CONNECTION_THRESHOLD: "1000"
      WATCHER_MIN_CONSECUTIVE_POLLS: "3"

      # Discovery enabled — registers ssh_target CI in CMDB
      WATCHER_DISCOVERY_ENABLED: "true"

      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app/src
